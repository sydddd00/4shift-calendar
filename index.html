<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4조 교대 근무표</title>
<meta name="description" content="4조 교대 근무표 — 오전·오후·야간·휴무 1주 순환 근무표, 연차·휴가 관리, 조별 비교, 친구와 링크 공유, 캘린더(.ics) 내보내기">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="4조 근무표">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <span class="lg lg-d"></span><span class="lg lg-e"></span><span class="lg lg-n"></span><span class="lg lg-o"></span>
      </span>
      <h1>4조 근무표</h1>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btnShare" data-action="share" aria-label="공유">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7.5 8.5 4.5-4.5 4.5 4.5"/><path d="M5 14v5a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-5"/></svg>
      </button>
      <button class="icon-btn" id="btnSettings" data-action="settings" aria-label="설정">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.11A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.7 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.11A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.7a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.11A1.7 1.7 0 0 0 15 4.7a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.3 9c.2.6.75 1 1.4 1.03H21a2 2 0 1 1 0 4h-.11A1.7 1.7 0 0 0 19.4 15z"/></svg>
      </button>
    </div>
  </header>

  <div id="sharedBanner" class="shared-banner" hidden></div>

  <main class="main">
    <section id="todayCard" class="today-card"></section>

    <div class="segmented" id="viewSwitch" role="tablist" aria-label="보기 선택">
      <button role="tab" data-view="mine" class="active" aria-selected="true">내 조</button>
      <button role="tab" data-view="all" aria-selected="false">4조 전체</button>
    </div>

    <section class="cal">
      <div class="cal-head">
        <button class="nav" id="prevMonth" data-action="prev" aria-label="이전 달">‹</button>
        <button class="month-label" id="monthLabel" data-action="pickMonth">2026년 11월</button>
        <button class="nav" id="nextMonth" data-action="next" aria-label="다음 달">›</button>
        <button class="today-btn" id="todayBtn" data-action="today">오늘</button>
      </div>
      <div class="weekdays">
        <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span>
      </div>
      <div class="grid" id="grid"></div>
      <div class="legend" id="legend"></div>
    </section>

    <section id="leaveCard" class="leave-card"></section>

    <div class="quick-actions">
      <button class="qa" data-action="share">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.1 0l3-3a5 5 0 0 0-7.1-7.1L11 4.9"/><path d="M14 11a5 5 0 0 0-7.1 0l-3 3a5 5 0 0 0 7.1 7.1L13 19.1"/></svg>
        링크 공유
      </button>
      <button class="qa" data-action="ics">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M12 13v5M9.6 15.4 12 18l2.4-2.6"/></svg>
        캘린더에 넣기
      </button>
      <button class="qa" data-action="settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>
        설정
      </button>
    </div>

    <p class="footnote">근무표는 이 기기에 저장돼요. 친구에게는 <b>링크 공유</b>로 보내면 같은 근무표가 열립니다.</p>
  </main>
</div>

<div id="installBanner" class="install-banner" hidden>
  <div class="ib-text">
    <b>홈 화면에 추가</b>하면 앱처럼 바로 열려요
  </div>
  <button class="ib-btn" data-action="install-help">보는 법</button>
  <button class="ib-close" data-action="install-dismiss" aria-label="닫기">✕</button>
</div>

<div id="backdrop" class="backdrop" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div id="sheetInner"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<noscript><p style="padding:24px;text-align:center">이 근무표는 자바스크립트가 필요합니다. Safari 설정에서 자바스크립트를 켜 주세요.</p></noscript>

<script src="app.js"></script>
</body>
</html>
